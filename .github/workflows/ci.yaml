name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout article repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CONTENT_REPOSITORY }}
          ref: ${{ vars.CONTENT_REF || 'main' }}
          path: content-source
          token: ${{ secrets.CONTENT_READ_TOKEN || github.token }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache/restore@v4
        with:
          path: .cache/reactions.json
          key: reactions-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: reactions-v1-

      - run: pnpm run build
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          CONTENT_DIR: ./content-source
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
          PREVIOUS_REACTIONS_URL: ${{ vars.PREVIOUS_REACTIONS_URL }}
